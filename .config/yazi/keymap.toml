[[mgr.append_keymap]]
on  = ["c", "s"]
run = "plugin steam"

[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

[[mgr.prepend_keymap]]
on   = [ "g", "s" ]
run  = "cd /home/tapo4eg3d/.steam/steam/steamapps/common"
desc = "Go to the Steam folder (storage)"

[[mgr.prepend_keymap]]
on   = [ "g", "m" ]
run  = "cd /home/tapo4eg3d/Projects/MTS"
desc = "Go to the MTS Project dir"

[[mgr.prepend_keymap]]
on = ["i"]
run = ["toggle_all", "toggle", "remove --force"]

[[mgr.prepend_keymap]]
on   = [ "<C-n>" ]
run  = '''
    shell 'ripdrag --no-click -a "$@" -x 2>/dev/null &' --confirm
'''
desc = "Drag and Drop"
